name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Roda o CI à mão; o gitleaks então varre o histórico inteiro. Também cobre o primeiro push do
  # repositório, que o gitleaks-action não consegue varrer (o commit raiz não tem pai).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Os tipos da API são gerados de api/openapi.json; o arquivo commitado tem de ser o que o gerador produz.
      - name: Tipos da API sem drift
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts

      # O Vite só transpila; a checagem de tipos é um passo próprio.
      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # Jornadas críticas no Chromium, contra o build (`vite preview`) com a API simulada no navegador: o login real
  # passa pelo Entra, que o CI não alcança (README, seção "Testes de ponta a ponta"). Sem continue-on-error:
  # jornada quebrada bloqueia o merge como qualquer outro teste.
  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # O download do Chromium (~100 MB) é o passo mais lento; a chave é a versão do Playwright, que fixa o build do navegador.
      - name: Cache do Chromium
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar o Chromium e as bibliotecas do sistema
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # O cache guarda o navegador, não os pacotes do sistema (apt) que ele precisa.
      - name: Instalar só as bibliotecas do sistema
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E
        run: npm run e2e

      # O relatório HTML e os traces das jornadas que falharam.
      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # o gitleaks lista os commits do PR pela API
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o gitleaks varre o histórico inteiro, não só o último commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
